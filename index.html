<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: wss: data: blob: 'unsafe-inline' 'unsafe-eval';">
    <title>DigNex</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: white; overflow: hidden; }
        .hidden { display: none !important; }
        .btn { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-blue { background-color: #3b82f6; color: white; }
        .btn-red { background-color: #ef4444; color: white; }
        .btn:active { transform: scale(0.95); }
        .message { padding: 10px 14px; border-radius: 18px; margin-bottom: 10px; max-width: 75%; word-wrap: break-word; position: relative; }
        .message.sent { background-color: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message.received { background-color: #334155; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-time { font-size: 10px; opacity: 0.7; margin-top: 5px; display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
        .media-preview { max-width: 200px; border-radius: 8px; margin-top: 5px; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 20px; border: none; outline: none; background-color: #1e293b; color: white; box-sizing: border-box; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        
        /* Post Styling */
        .post-card { background-color: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .post-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        
        /* Nav Bar Styling */
        .nav-bar { background-color: #1e293b; display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #334155; }
        .nav-btn { background: none; border: none; color: #94a3b8; font-size: 16px; font-weight: bold; cursor: pointer; padding: 10px; width: 100%; }
        .nav-btn.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; }
    </style>
</head>
<body>

    <div id="loginScreen" style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;">
        <h1 style="font-size: 40px; color: #38bdf8; margin-bottom: 10px;">DigNex</h1>
        <p style="color: #94a3b8; margin-bottom: 30px;">Connect, Chat, and Share</p>
        <button id="googleLoginBtn" class="btn btn-blue" style="font-size: 18px; padding: 15px 30px;">Sign in with Google</button>
    </div>

    <div id="mainAppScreen" class="hidden" style="height: 100vh; display: flex; flex-direction: column;">
        <div style="padding: 15px; background-color: #1e293b; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img id="myAvatar" src="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #38bdf8;">
                <h2 id="myName" style="margin: 0; font-size: 18px;"></h2>
            </div>
            <div>
                <button onclick="document.getElementById('settingsScreen').classList.remove('hidden')" class="btn" style="background: none; font-size: 20px;">⚙️</button>
                <button id="logoutBtn" class="btn btn-red">Logout</button>
            </div>
        </div>

        <div style="flex-grow: 1; overflow-y: auto; background-color: #0f172a; position: relative;">
            
            <div id="viewChats" style="padding: 15px;">
                <h3 style="color: #94a3b8; font-size: 14px; text-transform: uppercase; margin-bottom: 15px;">Your Messages</h3>
                <div id="friendsList" style="display: flex; flex-direction: column; gap: 10px;"></div>
            </div>

            <div id="viewFeed" class="hidden" style="padding: 15px;">
                <div style="background-color: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 20px;">
                    <textarea id="postInput" placeholder="What's on your mind?" style="width: 100%; background: none; border: none; color: white; outline: none; resize: none; font-family: inherit; font-size: 16px; margin-bottom: 10px;"></textarea>
                    
                    <img id="postImagePreview" class="hidden media-preview" style="max-width: 100%; margin-bottom: 10px;">
                    <p id="postUploadStatus" style="color: #38bdf8; font-size: 12px; margin: 0;"></p>

                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <input type="file" id="postImageUpload" accept="image/*, video/*" class="hidden" onchange="previewPostMedia(event)">
                        <button onclick="document.getElementById('postImageUpload').click()" class="btn" style="background: none; font-size: 20px; padding: 0;">📷 Attach</button>
                        <button onclick="createPost()" class="btn btn-blue">Post to Feed</button>
                    </div>
                </div>
                
                <div id="feedTimeline"></div>
            </div>
        </div>

        <div class="nav-bar">
            <button id="tabChats" onclick="switchTab('chats')" class="nav-btn active">💬 Chats</button>
            <button id="tabFeed" onclick="switchTab('feed')" class="nav-btn">🌍 Feed</button>
        </div>
    </div>

    <div id="chatScreen" class="hidden" style="height: 100vh; display: flex; flex-direction: column; background-color: #0b1120; position: absolute; top: 0; left: 0; right: 0; z-index: 50;">
        
        <div style="padding: 15px; background-color: #1e293b; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155;">
            <div style="display: flex; align-items: center;">
                <button onclick="closeChat()" style="background: none; border: none; color: #38bdf8; font-size: 20px; margin-right: 15px; cursor: pointer;">⬅</button>
                <img id="chatHeaderAvatar" src="" style="width: 40px; height: 40px; border-radius: 50%; margin-right: 10px; object-fit: cover; border: 2px solid #38bdf8;">
                <h3 id="chatHeaderName" style="margin: 0; font-size: 18px;"></h3>
            </div>
            <button onclick="clearCurrentChat()" class="btn btn-red" style="padding: 6px 12px; font-size: 14px;">🗑️ Clear</button>
        </div>

        <div id="chatMessages" style="flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column;"></div>
        
        <div id="typingIndicator" class="hidden" style="color: #94a3b8; font-size: 12px; font-style: italic; padding: 0 15px 5px 15px;">
            Friend is typing...
        </div>

        <div style="padding: 0 15px;">
            <img id="chatImagePreview" class="hidden media-preview">
            <video id="chatVideoPreview" class="hidden media-preview" controls></video>
            <p id="chatUploadStatus" style="color: #38bdf8; font-size: 12px; margin: 5px 0 0 0;"></p>
        </div>

        <div style="padding: 15px; background-color: #1e293b; border-top: 1px solid #334155; display: flex; gap: 10px; align-items: center;">
            <input type="file" id="chatImageUpload" accept="image/*" class="hidden" onchange="previewChatMedia(event, 'image')">
            <input type="file" id="chatVideoUpload" accept="video/*" class="hidden" onchange="previewChatMedia(event, 'video')">
            
            <button onclick="document.getElementById('chatImageUpload').click()" class="btn" style="background: none; font-size: 20px; padding: 0;">📷</button>
            <button onclick="document.getElementById('chatVideoUpload').click()" class="btn" style="background: none; font-size: 20px; padding: 0;">🎥</button>
            
            <input type="text" id="chatInput" placeholder="Message..." oninput="handleTyping()" onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="btn btn-blue" style="border-radius: 50%; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center;">➤</button>
        </div>
    </div>

    <div id="settingsScreen" class="hidden" style="height: 100vh; background-color: #0f172a; position: absolute; top: 0; left: 0; right: 0; z-index: 100; padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="margin: 0;">Settings</h2>
            <button onclick="document.getElementById('settingsScreen').classList.add('hidden')" class="btn btn-red">Close</button>
        </div>
        <div style="background-color: #1e293b; padding: 20px; border-radius: 12px;">
            <h3 style="margin-top: 0;">Push Notifications</h3>
            <p style="color: #94a3b8; font-size: 14px; margin-bottom: 15px;">Receive alerts when your friends message you.</p>
            <button onclick="requestNotificationPermission()" class="btn btn-blue" style="width: 100%;">🔔 Enable Notifications</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, query, orderBy, doc, getDoc, setDoc, updateDoc, deleteDoc, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-messaging.js";

        // ⚠️ PASTE YOUR EXACT FIREBASE CONFIG HERE ⚠️
        const firebaseConfig = {
            apiKey: "AIzaSyCiF_rlhJO8TO3RJ2G4OaG9SOZoGgPpvhk",
            authDomain: "dignex-88f5b.firebaseapp.com",
            projectId: "dignex-88f5b",
            storageBucket: "dignex-88f5b.firebasestorage.app",
            messagingSenderId: "1039498013474",
            appId: "1:1039498013474:web:2299eefcfc750de54f537b"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const messaging = getMessaging(app);

        // Global Variables
        let currentUser = null;
        let digNexProfile = null;
        let currentChatFriendId = null;
        let chatUnsubscribe = null;
        let typingUnsubscribe = null;
        let chatSelectedFile = null;
        let chatSelectedFileType = null;
        let typingTimeout = null;

        // --- Cloudinary Upload Function ---
        const CLOUDINARY_UPLOAD_PRESET = "dcyl66lfc"; // ⚠️ PASTE HERE
        const CLOUDINARY_CLOUD_NAME = "lzxuzi3d";       // ⚠️ PASTE HERE

        async function uploadToCloudinary(file, resourceType) {
            const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`;
            const fd = new FormData();
            fd.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            fd.append('file', file);
            try {
                const response = await fetch(url, { method: 'POST', body: fd });
                const data = await response.json();
                return data.secure_url;
            } catch (error) { console.error("Cloudinary failed:", error); return null; }
        }

        // --- Authentication ---
        document.getElementById('googleLoginBtn').addEventListener('click', () => {
            signInWithPopup(auth, new GoogleAuthProvider()).catch(err => alert("Login failed: " + err.message));
        });

        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainAppScreen').classList.remove('hidden');

                const userDocRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userDocRef);

                if (!userSnap.exists()) {
                    digNexProfile = { customName: user.displayName, avatarBase64: user.photoURL, uid: user.uid };
                    await setDoc(userDocRef, digNexProfile);
                } else {
                    digNexProfile = userSnap.data();
                }

                document.getElementById('myName').innerText = digNexProfile.customName;
                document.getElementById('myAvatar').src = digNexProfile.avatarBase64;
                
                loadFriendsList();
                loadGlobalFeed(); // Start listening to posts!
            } else {
                currentUser = null;
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('mainAppScreen').classList.add('hidden');
                document.getElementById('chatScreen').classList.add('hidden');
            }
        });

        // --- Navigation Tabs ---
        window.switchTab = (tab) => {
            if (tab === 'chats') {
                document.getElementById('viewChats').classList.remove('hidden');
                document.getElementById('viewFeed').classList.add('hidden');
                document.getElementById('tabChats').classList.add('active');
                document.getElementById('tabFeed').classList.remove('active');
            } else {
                document.getElementById('viewFeed').classList.remove('hidden');
                document.getElementById('viewChats').classList.add('hidden');
                document.getElementById('tabFeed').classList.add('active');
                document.getElementById('tabChats').classList.remove('active');
            }
        };

        // --- The Global Feed (Phase 2A) ---
        let postSelectedFile = null;
        let postSelectedFileType = null;

        window.previewPostMedia = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            postSelectedFile = file;
            postSelectedFileType = file.type.startsWith('video/') ? 'video' : 'image';
            document.getElementById('postImagePreview').src = URL.createObjectURL(file);
            document.getElementById('postImagePreview').classList.remove('hidden');
        };

        window.createPost = async () => {
            const text = document.getElementById('postInput').value.trim();
            if (text === "" && !postSelectedFile) return;

            const statusLabel = document.getElementById('postUploadStatus');
            document.getElementById('postInput').value = "";
            let mediaUrl = null;

            if (postSelectedFile) {
                statusLabel.innerText = "Uploading to Feed...";
                mediaUrl = await uploadToCloudinary(postSelectedFile, postSelectedFileType);
                postSelectedFile = null;
                document.getElementById('postImagePreview').classList.add('hidden');
            }

            statusLabel.innerText = "Posting...";
            await addDoc(collection(db, "posts"), {
                authorId: currentUser.uid,
                authorName: digNexProfile.customName,
                authorAvatar: digNexProfile.avatarBase64,
                text: text,
                mediaUrl: mediaUrl,
                mediaType: postSelectedFileType,
                timestamp: serverTimestamp(),
            });
            statusLabel.innerText = "";
        };

        function loadGlobalFeed() {
            const q = query(collection(db, "posts"), orderBy("timestamp", "desc"), limit(50));
            onSnapshot(q, (snapshot) => {
                const timeline = document.getElementById('feedTimeline');
                timeline.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    const post = docSnap.data();
                    const div = document.createElement('div');
                    div.className = "post-card";
                    
                    let mediaHtml = "";
                    if (post.mediaUrl) {
                        if (post.mediaType === 'image') mediaHtml = `<img src="${post.mediaUrl}" style="width:100%; border-radius:8px; margin-top:10px;">`;
                        if (post.mediaType === 'video') mediaHtml = `<video src="${post.mediaUrl}" controls style="width:100%; border-radius:8px; margin-top:10px;"></video>`;
                    }

                    div.innerHTML = `
                        <div class="post-header">
                            <img src="${post.authorAvatar}" class="post-avatar">
                            <div>
                                <strong style="display:block;">${post.authorName}</strong>
                                <span style="font-size:10px; color:#94a3b8;">Just now</span>
                            </div>
                        </div>
                        <div style="font-size:15px; word-wrap:break-word;">${post.text || ''}</div>
                        ${mediaHtml}
                    `;
                    timeline.appendChild(div);
                });
            });
        }

        // --- Friends List ---
        function loadFriendsList() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                const list = document.getElementById('friendsList');
                list.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    const friend = docSnap.data();
                    if (friend.uid !== currentUser.uid) {
                        const div = document.createElement('div');
                        div.style.cssText = "display:flex; align-items:center; padding:12px; background-color:#1e293b; border-radius:12px; cursor:pointer;";
                        div.onclick = () => openChat(friend.uid, friend.customName, friend.avatarBase64);
                        div.innerHTML = `
                            <img src="${friend.avatarBase64}" style="width:45px; height:45px; border-radius:50%; object-fit:cover; margin-right:15px;">
                            <span style="font-weight:bold; font-size:16px;">${friend.customName}</span>
                        `;
                        list.appendChild(div);
                    }
                });
            });
        }

        // --- Chat & Real-Time Typing (Phase 2B & 2C) ---
        window.openChat = (friendId, friendName, friendAvatar) => {
            currentChatFriendId = friendId;
            document.getElementById('chatHeaderName').innerText = friendName;
            document.getElementById('chatHeaderAvatar').src = friendAvatar;
            document.getElementById('chatScreen').classList.remove('hidden');

            const chatId = currentUser.uid < friendId ? `${currentUser.uid}_${friendId}` : `${friendId}_${currentUser.uid}`;
            const messagesQuery = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));

            if (chatUnsubscribe) chatUnsubscribe();
            if (typingUnsubscribe) typingUnsubscribe();
            
            // 🚀 Phase 2C: Listen for Typing Status
            typingUnsubscribe = onSnapshot(doc(db, "chats", chatId), (docSnap) => {
                const typingUI = document.getElementById('typingIndicator');
                if (docSnap.exists() && docSnap.data()[`typing_${friendId}`] === true) {
                    typingUI.innerText = `${friendName} is typing...`;
                    typingUI.classList.remove('hidden');
                } else {
                    typingUI.classList.add('hidden');
                }
            });

            // 🚀 Phase 2B: Messages and Read Receipts
            chatUnsubscribe = onSnapshot(messagesQuery, (snapshot) => {
                const chatArea = document.getElementById('chatMessages');
                chatArea.innerHTML = "";
                
                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    const msgId = docSnap.id;
                    const isMe = msg.senderId === currentUser.uid;
                    
                    // IF I am reading their message, mark it as READ in the database!
                    if (!isMe && msg.read === false) {
                        updateDoc(doc(db, "chats", chatId, "messages", msgId), { read: true });
                    }

                    const div = document.createElement('div');
                    div.className = `message ${isMe ? 'sent' : 'received'}`;
                    
                    let content = "";
                    if (msg.mediaUrl) {
                        if (msg.mediaType === 'image') content += `<img src="${msg.mediaUrl}" style="max-width:100%; border-radius:8px; margin-bottom:5px;"><br>`;
                        if (msg.mediaType === 'video') content += `<video src="${msg.mediaUrl}" controls style="max-width:100%; border-radius:8px; margin-bottom:5px;"></video><br>`;
                    }
                    if (msg.text) content += msg.text;

                    // ADD READ RECEIPTS UI (Blue Checkmarks)
                    let ticksHtml = "";
                    if (isMe) {
                        ticksHtml = msg.read ? `<span style="color:#a5f3fc; font-weight:bold;">✓✓</span>` : `<span style="color:#cbd5e1;">✓</span>`;
                    }
                    
                    content += `<div class="msg-time">${ticksHtml}</div>`;
                    
                    div.innerHTML = content;
                    chatArea.appendChild(div);
                });
                chatArea.scrollTop = chatArea.scrollHeight;
            });
        };

        window.closeChat = () => {
            document.getElementById('chatScreen').classList.add('hidden');
            currentChatFriendId = null;
            if (chatUnsubscribe) chatUnsubscribe();
            if (typingUnsubscribe) typingUnsubscribe();
        };

        // 🚀 Phase 2C: Trigger Typing Status
        window.handleTyping = () => {
            if(!currentChatFriendId) return;
            const chatId = currentUser.uid < currentChatFriendId ? `${currentUser.uid}_${currentChatFriendId}` : `${currentChatFriendId}_${currentUser.uid}`;
            
            // Tell database I am typing
            setDoc(doc(db, "chats", chatId), { [`typing_${currentUser.uid}`]: true }, { merge: true });

            // Stop typing after 2 seconds
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                setDoc(doc(db, "chats", chatId), { [`typing_${currentUser.uid}`]: false }, { merge: true });
            }, 2000);
        };

        window.previewChatMedia = (event, type) => {
            const file = event.target.files[0];
            if (!file) return;
            chatSelectedFile = file;
            chatSelectedFileType = type;
            const imgPreview = document.getElementById('chatImagePreview');
            const vidPreview = document.getElementById('chatVideoPreview');
            
            if (type === 'image') { imgPreview.src = URL.createObjectURL(file); imgPreview.classList.remove('hidden'); vidPreview.classList.add('hidden'); }
            else { vidPreview.src = URL.createObjectURL(file); vidPreview.classList.remove('hidden'); imgPreview.classList.add('hidden'); }
        };

        window.sendMessage = async () => {
            const input = document.getElementById('chatInput'); 
            const text = input.value.trim();
            if ((text === "" && !chatSelectedFile) || !currentChatFriendId || !currentUser) return;
            
            const statusLabel = document.getElementById('chatUploadStatus'); 
            input.value = ""; 
            
            let chatMediaUrl = null;
            if (chatSelectedFile) {
                statusLabel.innerText = chatSelectedFileType === 'video' ? "Sending Video..." : "Sending Photo...";
                chatMediaUrl = await uploadToCloudinary(chatSelectedFile, chatSelectedFileType); 
                chatSelectedFile = null; chatSelectedFileType = null;
                document.getElementById('chatImagePreview').classList.add('hidden'); 
                document.getElementById('chatVideoPreview').classList.add('hidden');
                document.getElementById('chatImageUpload').value = ''; document.getElementById('chatVideoUpload').value = '';
            }
            
            if (chatMediaUrl || text !== "") {
                const chatId = currentUser.uid < currentChatFriendId ? `${currentUser.uid}_${currentChatFriendId}` : `${currentChatFriendId}_${currentUser.uid}`;
                
                // Add message (Default to unread)
                await addDoc(collection(db, "chats", chatId, "messages"), { 
                    senderId: currentUser.uid, text: text, mediaUrl: chatMediaUrl, mediaType: chatSelectedFileType, timestamp: serverTimestamp(), read: false 
                });
                
                // Push Notification
                try {
                    const friendDoc = await getDoc(doc(db, "users", currentChatFriendId));
                    if (friendDoc.data() && friendDoc.data().fcmToken) {
                        fetch('/.netlify/functions/sendPush', {
                            method: 'POST',
                            body: JSON.stringify({ token: friendDoc.data().fcmToken, title: `New message from ${digNexProfile.customName}`, body: text !== "" ? text : "Sent an attachment 📷" })
                        });
                    }
                } catch (err) {}
            }
            statusLabel.innerText = "";
        };

        window.clearCurrentChat = async () => {
            if (!currentChatFriendId || !currentUser) return;
            if (!confirm("Are you sure you want to clear this chat?")) return;
            const chatId = currentUser.uid < currentChatFriendId ? `${currentUser.uid}_${currentChatFriendId}` : `${currentChatFriendId}_${currentUser.uid}`;
            const messagesRef = collection(db, "chats", chatId, "messages");
            try {
                const snapshot = await getDocs(messagesRef);
                snapshot.forEach((docSnap) => deleteDoc(doc(db, "chats", chatId, "messages", docSnap.id)));
            } catch (error) { alert("Failed to clear chat."); }
        };

        window.requestNotificationPermission = async () => {
            try {
                const registration = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
                await navigator.serviceWorker.ready;
                const currentToken = await getToken(messaging, { vapidKey: "BOEJshwyI0lNpsEspDyuVG7M95DmColVvtcZWCWX85wCfbUd6F30L7N39oyBXP0o_gq55R1Qen1JPcglhznq2lU", serviceWorkerRegistration: registration });
                if (currentToken && currentUser) {
                    await updateDoc(doc(db, "users", currentUser.uid), { fcmToken: currentToken });
                    alert("SUCCESS! Notifications Enabled! 🎉");
                }
            } catch (error) { alert("ERROR: " + error.message); }
        };
    </script>
</body>
</html>
