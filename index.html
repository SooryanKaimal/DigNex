<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DigNex | The Super App</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval';">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b1120">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💠</text></svg>">
    
    <style>
        /* --- DYNAMIC THEME SYSTEM --- */
        :root {
            --bg-color: #0b1120; 
            --card-bg: rgba(30, 41, 59, 0.8);
            --accent: #6366f1; 
            --accent-hover: #4f46e5;
            --text-main: #f8fafc; 
            --text-muted: #94a3b8;
            --glass-border: 1px solid rgba(255, 255, 255, 0.08);
            --success: #10b981; 
            --danger: #ef4444;
            --menu-bg: rgba(30, 41, 59, 0.98);
        }

        body.light-mode {
            --bg-color: #f4f5f0; 
            --card-bg: #ffffff; 
            --accent: #557A46; 
            --accent-hover: #3E5A32;
            --text-main: #1c201a; 
            --text-muted: #6b7280;
            --glass-border: 1px solid rgba(0, 0, 0, 0.1);
            --menu-bg: rgba(255, 255, 255, 0.98);
        }

        /* --- CORE ARCHITECTURE --- */
        *, *::before, *::after { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; 
            background-color: var(--bg-color); color: var(--text-main); 
            display: flex; height: 100vh; height: 100dvh; width: 100vw; overflow: hidden; 
            transition: background-color 0.3s, color 0.3s;
        }

        input, textarea, select { font-size: 16px !important; color: var(--text-main); }
        body.light-mode input, body.light-mode textarea, body.light-mode select { background: rgba(0,0,0,0.05); }

        /* --- MOBILE TOP HEADER --- */
        .mobile-top-header {
            display: none; justify-content: center; align-items: center; 
            width: 100%; height: 55px; background: var(--card-bg); 
            border-bottom: var(--glass-border); z-index: 100; flex-shrink: 0;
            backdrop-filter: blur(10px);
        }

        /* --- LEFT SIDEBAR / NAV --- */
        .sidebar-left { 
            width: 250px; flex-shrink: 0; border-right: var(--glass-border); padding: 20px; 
            display: flex; flex-direction: column; gap: 15px; background: rgba(15, 23, 42, 0.5); z-index: 100;
        }
        body.light-mode .sidebar-left { background: rgba(255, 255, 255, 0.5); }
        
        .brand-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .logo { font-size: 28px; font-weight: 900; background: linear-gradient(to right, var(--accent), #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; letter-spacing: 1px;}
        
        .nav-item { position: relative; font-size: 16px; font-weight: 600; padding: 12px 15px; border-radius: 12px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
        .nav-item:hover { background: rgba(128,128,128,0.1); color: var(--accent); }
        .badge { background: #ef4444; color: white; font-size: 11px; font-weight: bold; padding: 2px 7px; border-radius: 20px; margin-left: auto; display: none; box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);}

        button { cursor: pointer; font-weight: bold; border: none; transition: 0.2s; }
        .btn-main { background-color: var(--accent); color: white; padding: 10px 20px; border-radius: 20px; width: 100%; margin-top: auto;}
        .btn-main:hover { background-color: var(--accent-hover); }

        /* --- CENTER AREA --- */
        .center-column { 
            flex: 1; min-width: 0; height: 100%; overflow-y: auto; padding: 20px; 
            display: flex; flex-direction: column; position: relative; -webkit-overflow-scrolling: touch; 
        }
        
        /* CREATE POST PAGE */
        .create-post-container { background: var(--card-bg); padding: 20px; border-radius: 20px; border: var(--glass-border); width: 100%; }
        textarea { width: 100%; background: transparent; border: none; resize: none; outline: none; margin-bottom: 15px; font-family: inherit; min-height: 100px;}
        .privacy-select { background: rgba(128,128,128,0.1); border: var(--glass-border); color: var(--text-main); padding: 8px 12px; border-radius: 15px; outline: none; cursor: pointer; margin-right: 10px; }
        .privacy-select option { background: var(--card-bg); color: var(--text-main); }
        .media-buttons { display: flex; gap: 10px; border-top: var(--glass-border); padding-top: 15px; align-items: center; flex-wrap: wrap; }
        .media-btn { background: rgba(128,128,128,0.1); color: var(--accent); padding: 8px 15px; border-radius: 15px; font-size: 14px; display: flex; align-items: center; gap: 5px;}
        .media-btn:hover { background: rgba(128,128,128,0.2); }
        #imagePreview, #videoPreview { max-width: 100%; max-height: 300px; border-radius: 10px; display: none; margin-bottom: 15px; background: rgba(0,0,0,0.1); object-fit: contain;}
        
        /* HOME FEED */
        .feed-area { display: flex; flex-direction: column; gap: 20px; max-width: 600px; width: 100%; margin: 0 auto; padding-bottom: 30px;}
        .post-card { background: var(--card-bg); border: var(--glass-border); padding: 20px; border-radius: 20px; overflow-wrap: break-word; word-break: break-word; box-shadow: 0 4px 6px rgba(0,0,0,0.05);}
        .post-header { font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 10px;}
        .post-avatar { width: 40px; height: 40px; background: var(--accent); border-radius: 50%; object-fit: cover; flex-shrink: 0; cursor: pointer; }
        .post-media { width: 100%; border-radius: 15px; margin-top: 15px; max-height: 400px; object-fit: contain; background: rgba(0,0,0,0.1); }
        
        .action-link { background: none; color: var(--text-muted); font-size: 14px; cursor: pointer; padding: 8px 12px; border-radius: 10px; font-weight: 600; display: flex; align-items: center; gap: 5px;}
        .action-link:hover { color: var(--text-main); background: rgba(128,128,128,0.1); }
        .action-link.danger:hover { color: var(--danger); background: rgba(239, 68, 68, 0.1); }
        .action-link.liked { color: #ef4444; }

        .comments-section { display: none; margin-top: 15px; border-top: var(--glass-border); padding-top: 15px; }
        .comment-input-area { display: flex; gap: 10px; margin-top: 10px; }
        .comment-input-area input { flex: 1; background: rgba(128,128,128,0.1); border: var(--glass-border); color: var(--text-main); padding: 10px 15px; border-radius: 20px; outline: none; }

        /* NOTIFICATIONS VIEW */
        #notificationsView { display: none; flex-direction: column; max-width: 600px; width: 100%; margin: 0 auto; }
        .notif-card { background: var(--card-bg); border: var(--glass-border); padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 15px; cursor: pointer;}
        .notif-card:hover { filter: brightness(1.1); }
        .notif-unread { border-left: 4px solid var(--accent); }

        /* USER PROFILE VIEW */
        #userProfileView { display: none; flex-direction: column; max-width: 600px; width: 100%; margin: 0 auto; }
        .profile-banner { background: var(--card-bg); padding: 40px 20px; border-radius: 20px; border: var(--glass-border); margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; gap: 15px; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .profile-banner-avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid var(--accent); background: var(--bg-color); }
        .profile-back-btn { position: absolute; top: 15px; left: 15px; background: rgba(128,128,128,0.2); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; color: var(--text-main); border: none; }

        /* CHAT VIEW */
        #chatView { display: none; flex-direction: column; height: 100%; max-width: 800px; margin: 0 auto; width: 100%; background: var(--card-bg); border-radius: 20px; border: var(--glass-border); overflow: hidden; position: relative;}
        .chat-header { padding: 15px 20px; background: rgba(128,128,128,0.1); border-bottom: var(--glass-border); display: flex; align-items: center; gap: 15px; font-size: 18px; font-weight: bold; flex-shrink: 0;}
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch;}
        
        .chat-bubble-wrapper { max-width: 85%; display: flex; flex-direction: column; cursor: pointer; user-select: none; -webkit-user-select: none; }
        .chat-bubble-wrapper.sent { align-self: flex-end; align-items: flex-end; }
        .chat-bubble-wrapper.received { align-self: flex-start; align-items: flex-start; }
        .chat-bubble { padding: 12px 18px; border-radius: 18px; overflow-wrap: break-word; word-break: break-word; line-height: 1.4; transition: opacity 0.2s;}
        .chat-bubble:active { opacity: 0.7; } 
        .msg-sent { background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .msg-received { background: rgba(128,128,128,0.1); border: var(--glass-border); border-bottom-left-radius: 4px; }
        .chat-media { max-width: 100%; border-radius: 10px; margin-top: 8px; }
        
        .chat-input-area { padding: 12px; background: rgba(128,128,128,0.1); border-top: var(--glass-border); display: flex; align-items: center; gap: 8px; flex-shrink: 0;}
        .chat-input-area input[type="text"] { flex: 1; background: rgba(128,128,128,0.1); border: var(--glass-border); color: var(--text-main); padding: 12px 15px; border-radius: 25px; outline: none; min-width: 0;}
        .action-icon { background:none; color:var(--text-muted); font-size: 22px; cursor: pointer; transition: 0.2s; padding: 5px; flex-shrink: 0;}
        .recording { color: #ef4444 !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* CONTEXT MENU */
        .context-menu {
            display: none; position: fixed; background: var(--menu-bg); border: var(--glass-border);
            border-radius: 12px; z-index: 2000; flex-direction: column; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); backdrop-filter: blur(10px); min-width: 150px;
        }
        .context-menu button { background: none; border: none; color: var(--text-main); padding: 15px 20px; text-align: left; font-size: 16px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
        .context-menu button.danger { color: var(--danger); }

        /* --- RIGHT SIDEBAR --- */
        .sidebar-right { 
            width: 300px; flex-shrink: 0; border-left: var(--glass-border); padding: 20px; 
            background: rgba(15, 23, 42, 0.5); overflow-y: auto; display: flex; flex-direction: column; gap: 20px; transition: 0.3s ease; 
        }
        body.light-mode .sidebar-right { background: rgba(255,255,255,0.5); }

        .search-box { background: rgba(128,128,128,0.1); border: var(--glass-border); padding: 12px 15px; border-radius: 20px; color: var(--text-main); width: 100%; outline: none; }
        .friend-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 10px; border-radius: 12px; background: rgba(128,128,128,0.05); border: var(--glass-border); }
        .friend-info { display: flex; align-items: center; gap: 10px; overflow: hidden; cursor: pointer;}
        .friend-avatar { width: 35px; height: 35px; background: var(--accent); border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .friend-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; font-size: 14px;}
        .btn-small { padding: 6px 10px; border-radius: 15px; font-size: 12px; color: white; }
        .bg-accent { background: var(--accent); } .bg-success { background: var(--success); } .bg-danger { background: var(--danger); }

        /* --- MOBILE LAYOUT --- */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .mobile-top-header { display: flex; }
            .center-column { flex: 1; padding: 10px; padding-bottom: 0; height: calc(100dvh - 125px); }
            #chatView { border-radius: 0; border: none; height: 100%; max-height: calc(100dvh - 125px); }
            
            .sidebar-left { 
                flex-direction: row; justify-content: space-around; align-items: center; 
                height: 70px; width: 100%; padding: 5px; border-right: none; border-top: var(--glass-border); 
                background: var(--card-bg); position: fixed; bottom: 0; left: 0; padding-bottom: env(safe-area-inset-bottom);
            }
            .nav-item { padding: 10px; flex-direction: column; gap: 2px; }
            .nav-item span { display: none; } 
            .badge { position: absolute; top: 0px; right: 0px; transform: none; font-size: 10px; padding: 2px 6px; }
            
            .brand-header, #userInfo span { display: none; }
            #loginBtn { width: auto; margin: 0; padding: 8px 12px; font-size: 12px; }
            #userInfo { margin: 0; flex-direction: row; }
            
            .sidebar-right { position: fixed; top: 0; right: -100%; width: 85%; max-width: 350px; height: 100dvh; z-index: 200; box-shadow: -5px 0 25px rgba(0,0,0,0.5); background: var(--bg-color); }
            .sidebar-right.active { right: 0; }
        }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 3000; justify-content: center; align-items: center; padding: 20px;}
        .modal-content { background: var(--bg-color); border: var(--glass-border); padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
    </style>
</head>
<body>

    <div class="mobile-top-header">
        <h1 class="logo" style="font-size: 22px;">DigNex</h1>
    </div>

    <div id="customContextMenu" class="context-menu"></div>

    <div class="modal-overlay" id="profileModal">
        <div class="modal-content">
            <h2 style="margin: 0;">⚙️ Settings</h2>
            
            <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(128,128,128,0.1); padding: 10px; border-radius: 15px;">
                <span style="font-weight: bold;">App Theme</span>
                <button class="btn-small bg-accent" id="themeToggleBtn" onclick="toggleTheme()">☀️ Light Mode</button>
            </div>
            
            <hr style="border: 0; border-top: var(--glass-border); width: 100%; margin: 5px 0;">
            
            <label style="font-size: 12px; color: var(--text-muted);">Profile Picture</label>
            <input type="file" id="avatarUploadInput" accept="image/*" style="font-size: 14px;">
            
            <label style="font-size: 12px; color: var(--text-muted);">Display Name</label>
            <input type="text" id="customNameInput" placeholder="Enter display name...">
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn-main" onclick="saveProfile()">Save Changes</button>
                <button class="btn-main" style="background: transparent; border: var(--glass-border); color: var(--text-main);" onclick="closeProfileModal()">Cancel</button>
            </div>

            <button class="btn-main" style="margin-top: 10px; background-color: var(--success);" onclick="requestNotificationPermission()">
                🔔 Enable Notifications
            </button>

            <button class="btn-main bg-danger" style="margin-top: 10px; background-color: var(--danger);" onclick="logOut()">🚪 Logout</button>
        </div>
    </div>

    <div class="center-column" id="mainScrollArea" onclick="closeContextMenu()">
        
        <div id="homeView">
            <div class="feed-area" id="feedArea"></div>
        </div>

        <div id="createPostView" style="display: none; flex-direction: column; width: 100%; max-width: 600px; margin: 0 auto;">
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
                <button onclick="goHome()" class="profile-back-btn" style="position: relative; top: 0; left: 0;">←</button>
                <h2 style="margin: 0;">New Post</h2>
            </div>
            
            <div class="create-post-container">
                <textarea id="postInput" placeholder="What's on your mind?"></textarea>
                
                <input type="file" id="imageUpload" accept="image/*" style="display: none;" onchange="previewMedia(event, 'imagePreview')">
                <input type="file" id="videoUpload" accept="video/*" style="display: none;" onchange="previewMedia(event, 'videoPreview')">
                
                <img id="imagePreview" src="">
                <video id="videoPreview" controls></video>
                
                <div class="media-buttons">
                    <button class="media-btn" onclick="document.getElementById('imageUpload').click()">📷 Add Photo</button>
                    <button class="media-btn" onclick="document.getElementById('videoUpload').click()">🎥 Add Video</button>
                    <select id="postPrivacy" class="privacy-select" style="margin-left: auto;">
                        <option value="public">🌍 Public</option>
                        <option value="friends">👥 Friends Only</option>
                    </select>
                    <button id="postBtn" class="btn-main" style="margin-top: 0; width: auto; padding: 8px 25px;" onclick="createPost()">Share</button>
                </div>
                <span id="uploadStatus" style="color: var(--accent); font-size: 14px; margin-top: 10px; display: block;"></span>
            </div>
        </div>

        <div id="notificationsView">
            <h2 style="margin-top: 0; display: flex; align-items: center; gap: 10px;">🔔 Activity Hub</h2>
            <div id="notificationsList" class="feed-area">
                <div style="text-align:center; color:var(--text-muted);">No recent activity.</div>
            </div>
        </div>

        <div id="userProfileView">
            <div class="profile-banner">
                <button class="profile-back-btn" onclick="goHome()">←</button>
                <img id="targetProfileAvatar" class="profile-banner-avatar" src="">
                <h2 id="targetProfileName" style="margin: 0; font-size: 24px;">User Name</h2>
                <div id="targetProfileActions" style="display: flex; gap: 10px; margin-top: 10px;"></div>
            </div>
            <h3 style="margin-top: 0; color: var(--text-muted);">Recent Posts</h3>
            <div class="feed-area" id="profileFeedArea"></div>
        </div>

        <div id="chatView">
            <div class="chat-header">
                <button onclick="goHome()" style="background: none; color: var(--text-main); font-size: 24px; margin-right: 10px; padding: 0;">←</button>
                <img id="chatHeaderAvatar" src="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; display: none;">
                <span id="chatFriendName">Chat</span>
            </div>
            
            <div class="chat-messages" id="chatMessages" onscroll="closeContextMenu()"></div>
            
            <img id="chatImagePreview" src="" style="display: none; height: 80px; object-fit: contain; margin: 0 15px; border-radius: 10px;">
            <video id="chatVideoPreview" src="" style="display: none; height: 80px; margin: 0 15px; border-radius: 10px;" controls></video>
            <span id="chatUploadStatus" style="color: var(--accent); font-size: 12px; margin-left: 15px; display: block;"></span>

            <div class="chat-input-area">
                <input type="file" id="chatImageUpload" accept="image/*" style="display: none;" onchange="previewMedia(event, 'chatImagePreview')">
                <input type="file" id="chatVideoUpload" accept="video/*" style="display: none;" onchange="previewMedia(event, 'chatVideoPreview')">
                
                <button class="action-icon" onclick="document.getElementById('chatImageUpload').click()" title="Send Photo">📷</button>
                <button class="action-icon" onclick="document.getElementById('chatVideoUpload').click()" title="Send Video">🎥</button>
                <button class="action-icon" id="micBtn" onclick="toggleAudioRecord()" title="Hold to Record Audio">🎙️</button>
                
                <input type="text" id="chatInput" placeholder="Message..." onkeypress="handleChatEnter(event)">
                <button onclick="sendMessage()" style="background: var(--accent); color: white; border-radius: 50%; width: 45px; height: 45px; font-size: 18px; flex-shrink: 0;">➤</button>
            </div>
        </div>
    </div>

    <div class="sidebar-left">
        <div class="brand-header">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="url(#logo-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <defs><linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366f1" /><stop offset="100%" stop-color="#a855f7" /></linearGradient></defs>
                <circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            <h1 class="logo">DigNex</h1>
        </div>

        <div class="nav-item" onclick="goHome()">🏠 <span>Feed</span></div>
        <div class="nav-item" onclick="openCreatePost()">➕ <span>Create</span></div>
        <div class="nav-item" onclick="toggleFriendsMenu()">
            👥 <span>Friends</span>
            <div id="navBadge" class="badge">0</div>
        </div>
        <div class="nav-item" onclick="openNotifications()">
            🔔 <span>Activity</span>
            <div id="activityBadge" class="badge">0</div>
        </div>
        <div class="nav-item" onclick="openProfileModal()">⚙️ <span>Settings</span></div>
        
        <button id="loginBtn" class="btn-main" onclick="signIn()">Google Login</button>
        <div id="userInfo" style="display: none; margin-top: auto; flex-direction: column; align-items: center; gap: 10px;">
            <img id="myAvatarDisplay" src="" style="width: 45px; height: 45px; border-radius: 50%; object-fit: cover; display: none; cursor:pointer; border: 2px solid var(--accent);" onclick="if(currentUser) openUserProfile(currentUser.uid)">
        </div>
    </div>

    <div class="sidebar-right" id="rightSidebar">
        <button onclick="toggleFriendsMenu()" style="display: block; background: rgba(128,128,128,0.2); border:none; color:var(--text-main); padding:10px; border-radius:10px; width:100%; margin-bottom:15px; font-weight:bold;" class="mobile-close-btn">Close Menu ✖</button>
        
        <div>
            <input type="text" class="search-box" id="userSearch" placeholder="🔍 Search users..." onkeyup="searchUsers()">
            <div id="searchResults" style="margin-top: 10px;"></div>
        </div>
        <div id="requestsSection" style="display: none;">
            <h4 style="color: var(--text-muted); font-size: 12px; margin-top: 20px;">FRIEND REQUESTS</h4>
            <div id="requestsList"></div>
        </div>
        <div>
            <h4 style="color: var(--text-muted); font-size: 12px; margin-top: 20px;">MY FRIENDS</h4>
            <div id="friendsList"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, orderBy, query, onSnapshot, doc, setDoc, getDoc, deleteDoc, updateDoc, arrayUnion, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        
        // --- ADDED MESSAGING IMPORTS FOR NATIVE PUSH ---

                        const canvas = document.createElement('canvas'); canvas.width = 150; canvas.height = 150;
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, 150, 150); resolve(canvas.toDataURL('image/jpeg', 0.8));

            });
        };

        window.editMessage = async (msgId, encodedText) => { const currentText = decodeURIComponent(encodedText); const newText = prompt("Edit your message:", currentText); if (newText !== null && newText.trim() !== "") { const chatId = currentUser.uid < currentChatFriendId ? `${currentUser.uid}_${currentChatFriendId}` : `${currentChatFriendId}_${currentUser.uid}`; await updateDoc(doc(db, "chats", chatId, "messages", msgId), { text: newText.trim(), isEdited: true }); } };

        const customMenu = document.getElementById('customContextMenu');
        window.showContextMenu = (e, msgId, safeText, isMine) => {
            e.preventDefault(); 
            let x = e.clientX || (e.touches && e.touches[0].clientX); let y = e.clientY || (e.touches && e.touches[0].clientY);
            if (x > window.innerWidth - 180) x = window.innerWidth - 180; if (y > window.innerHeight - 150) y = window.innerHeight - 150;
            if (x < 10) x = 10; if (y < 10) y = 10;
            customMenu.style.left = `${x}px`; customMenu.style.top = `${y}px`; customMenu.style.display = 'flex';
            let menuHTML = `<button onclick="navigator.clipboard.writeText(decodeURIComponent('${safeText}')); closeContextMenu();">📄 Copy Text</button>`;
            if (isMine) { menuHTML += `<button onclick="editMessage('${msgId}', '${safeText}'); closeContextMenu();">✏️ Edit</button><button class="danger" onclick="deleteMessage('${msgId}'); closeContextMenu();">🗑️ Unsend</button>`; }
            customMenu.innerHTML = menuHTML;
        };
        window.closeContextMenu = () => { customMenu.style.display = 'none'; };

        window.openChat = (friendId, friendName, friendAvatarBase64) => {
            if (!currentUser) return;
            hideAllViews(); document.getElementById('chatView').style.display = 'flex'; 
            currentChatFriendId = friendId; document.getElementById('chatFriendName').innerText = friendName || "Chat";
            const headerAvatar = document.getElementById('chatHeaderAvatar');
            if(friendAvatarBase64 && friendAvatarBase64 !== "undefined") { headerAvatar.src = friendAvatarBase64; headerAvatar.style.display = 'block'; } else { headerAvatar.style.display = 'none'; }
            const chatId = currentUser.uid < friendId ? `${currentUser.uid}_${friendId}` : `${friendId}_${currentUser.uid}`;
            if (chatUnsubscribe) chatUnsubscribe();
            const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));
            const chatMessagesDiv = document.getElementById('chatMessages');

            chatUnsubscribe = onSnapshot(q, (snapshot) => {
                chatMessagesDiv.innerHTML = '';
                snapshot.forEach((doc) => {
                    const msg = doc.data(); const isMine = msg.senderId === currentUser.uid;
                    const wrapperDiv = document.createElement('div'); wrapperDiv.className = `chat-bubble-wrapper ${isMine ? 'sent' : 'received'}`;
                    const msgDiv = document.createElement('div'); msgDiv.className = `chat-bubble ${isMine ? 'msg-sent' : 'msg-received'}`;
                    let editedTag = msg.isEdited ? `<span style="font-size: 10px; opacity: 0.7; margin-left: 5px;">(edited)</span>` : "";
                    let content = (msg.text || "") + editedTag;
                    if(msg.mediaUrl) {
                        if(msg.mediaType === 'video') content += `${content ? '<br>' : ''}<video src="${msg.mediaUrl}" class="chat-media" controls></video>`;
                        else if(msg.mediaType === 'audio') content += `${content ? '<br>' : ''}<audio src="${msg.mediaUrl}" controls style="width: 200px; height: 30px; margin-top: 5px;"></audio>`;
                        else content += `${content ? '<br>' : ''}<img src="${msg.mediaUrl}" class="chat-media">`;
                    }
                    msgDiv.innerHTML = content; const safeText = encodeURIComponent(msg.text || "");
                    wrapperDiv.oncontextmenu = (e) => showContextMenu(e, doc.id, safeText, isMine);
                    wrapperDiv.addEventListener('touchstart', (e) => { longPressTimer = window.setTimeout(() => showContextMenu(e, doc.id, safeText, isMine), 600); });
                    wrapperDiv.addEventListener('touchend', () => clearTimeout(longPressTimer));
                    wrapperDiv.addEventListener('touchmove', () => clearTimeout(longPressTimer));
                    wrapperDiv.appendChild(msgDiv); chatMessagesDiv.appendChild(wrapperDiv);
                });
                chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
            });
        };

        window.toggleAudioRecord = async () => {
            const micBtn = document.getElementById('micBtn'); const statusLabel = document.getElementById('chatUploadStatus');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream); mediaRecorder.start(); isRecording = true; micBtn.classList.add('recording'); audioChunks = [];
                    mediaRecorder.addEventListener("dataavailable", event => { audioChunks.push(event.data); });
                    mediaRecorder.addEventListener("stop", async () => {
                        micBtn.classList.remove('recording'); statusLabel.innerText = "Sending audio...";
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' }); const audioFile = new File([audioBlob], "voice_msg.webm", { type: 'audio/webm' });
                        const audioUrl = await uploadToCloudinary(audioFile, 'video');
                        if(audioUrl && currentChatFriendId) {
                            const chatId = currentUser.uid < currentChatFriendId ? `${currentUser.uid}_${currentChatFriendId}` : `${currentChatFriendId}_${currentUser.uid}`;
                            await addDoc(collection(db, "chats", chatId, "messages"), { senderId: currentUser.uid, text: "", mediaUrl: audioUrl, mediaType: 'audio', timestamp: serverTimestamp() });
                            
                            // Trigger Notification for Audio
                            await addDoc(collection(db, "users", currentChatFriendId, "notifications"), { 
                                type: 'message', fromName: digNexProfile.customName, fromId: currentUser.uid, fromAvatar: digNexProfile.avatarBase64, timestamp: serverTimestamp(), read: false 
                            });
                        }
                        statusLabel.innerText = "";
                    });
                } catch (err) { alert("Microphone access denied!"); }
            } else { mediaRecorder.stop(); isRecording = false; }
        };

        window.sendMessage = async () => {
            const input = document.getElementById('chatInput'); const text = input.value.trim();
            if ((text === "" && !chatSelectedFile) || !currentChatFriendId || !currentUser) return;
            const statusLabel = document.getElementById('chatUploadStatus'); input.value = ""; 
            
            let chatMediaUrl = null;
            if(chatSelectedFile) {
                statusLabel.innerText = chatSelectedFileType === 'video' ? "Sending Video..." : "Sending Photo...";
                const resType = chatSelectedFileType === 'video' ? 'video' : 'image';
                chatMediaUrl = await uploadToCloudinary(chatSelectedFile, resType); 
                chatSelectedFile = null; chatSelectedFileType = null;
                document.getElementById('chatImagePreview').style.display = 'none'; document.getElementById('chatVideoPreview').style.display = 'none';
                document.getElementById('chatImageUpload').value = ''; document.getElementById('chatVideoUpload').value = '';
            }
            
            if(chatMediaUrl || text !== "") {
                const chatId = currentUser.uid < currentChatFriendId ? `${currentUser.uid}_${currentChatFriendId}` : `${currentChatFriendId}_${currentUser.uid}`;
                
                // 1. Save message to database
                await addDoc(collection(db, "chats", chatId, "messages"), { senderId: currentUser.uid, text: text, mediaUrl: chatMediaUrl, mediaType: chatSelectedFileType, timestamp: serverTimestamp() });
                
                // 2. Trigger In-App Notification
                await addDoc(collection(db, "users", currentChatFriendId, "notifications"), { 
                    type: 'message', fromName: digNexProfile.customName, fromId: currentUser.uid, fromAvatar: digNexProfile.avatarBase64, timestamp: serverTimestamp(), read: false 
                });

                // ========================================================
                // 🚀 3. THE MAGIC: FIRE THE NATIVE PUSH NOTIFICATION!
                // ========================================================
                try {
                    // Fetch the friend's device token from the database
                    const friendDoc = await getDoc(doc(db, "users", currentChatFriendId));
                    const friendData = friendDoc.data();

                    if (friendData && friendData.fcmToken) {
                        let pushBody = text !== "" ? text : "Sent an attachment 📷";
                        
                        // Call our Netlify Backend Server
                        fetch('/.netlify/functions/sendPush', {
                            method: 'POST',
                            body: JSON.stringify({
                                token: friendData.fcmToken,
                                title: `New message from ${digNexProfile.customName}`,
                                body: pushBody
                            })
                        }).then(res => console.log("Netlify Server Pinged!"))
                          .catch(err => console.error("Netlify Ping Failed:", err));
                    }
                } catch (err) {
                    console.log("Push error:", err);
                }
            }
            statusLabel.innerText = "";
        };

        window.handleChatEnter = (e) => { if (e.key === 'Enter') sendMessage(); };

        // --- PWA SERVICE WORKER REGISTRATION ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('DigNex App installed successfully!', reg.scope))
                    .catch((err) => console.log('App install failed:', err));
            });
        }

    </script>
</body>
</html>
