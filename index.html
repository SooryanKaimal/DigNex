<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: wss: data: blob: 'unsafe-inline' 'unsafe-eval';">
    <title>DigNex</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background-color: #0b1120; color: white; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .hidden { display: none !important; }
        .btn { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-blue { background-color: #38bdf8; color: #0b1120; }
        .btn-red { background-color: #ef4444; color: white; }
        .btn:active { transform: scale(0.95); }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 20px; border: none; outline: none; background-color: #1e293b; color: white; box-sizing: border-box; }
        
        /* Original Chat Bubbles */
        .message { padding: 10px 14px; border-radius: 18px; margin-bottom: 10px; max-width: 75%; word-wrap: break-word; }
        .message.sent { background-color: #38bdf8; color: #0b1120; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message.received { background-color: #1e293b; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
        .media-preview { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 5px; object-fit: contain; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        /* Full Screen Overlays */
        .screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: #0b1120; z-index: 50; display: flex; flex-direction: column; }
        .flex-center { justify-content: center; align-items: center; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <div id="loginScreen" class="screen flex-center">
        <h1 style="font-size: 50px; color: #38bdf8; margin-bottom: 10px;">DigNex</h1>
        <p style="color: #94a3b8; margin-bottom: 40px; font-size: 18px;">Connect, Chat, and Share</p>
        <button id="googleLoginBtn" class="btn btn-blue" style="font-size: 18px; padding: 15px 30px;">Sign in with Google</button>
    </div>

    <div id="profileSetupScreen" class="screen flex-center hidden" style="z-index: 60;">
        <h2 style="color: #38bdf8;">Create Your Profile</h2>
        <div style="position: relative; margin-bottom: 30px; margin-top: 20px;">
            <img id="setupAvatarPreview" src="https://via.placeholder.com/150" style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 3px solid #38bdf8;">
            <button onclick="document.getElementById('setupAvatarInput').click()" class="btn btn-blue" style="position: absolute; bottom: 0; right: 0; border-radius: 50%; padding: 10px;">📷</button>
            <input type="file" id="setupAvatarInput" accept="image/*" class="hidden" onchange="previewSetupAvatar(event)">
        </div>
        <input type="text" id="setupNameInput" placeholder="Enter your display name" style="margin-bottom: 20px; text-align: center; font-size: 18px; max-width: 300px;">
        <p id="setupStatus" style="color: #38bdf8; font-size: 14px; margin-bottom: 15px;"></p>
        <button onclick="saveProfile()" class="btn btn-blue" style="width: 100%; max-width: 300px; font-size: 18px;">Join DigNex</button>
    </div>

    <div id="mainAppScreen" class="screen hidden" style="z-index: 40;">
        <div style="padding: 15px 20px; background-color: #1e293b; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <img id="myAvatar" src="" style="width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #38bdf8;">
                <h2 id="myName" style="margin: 0; font-size: 18px;"></h2>
            </div>
            <button onclick="document.getElementById('settingsScreen').classList.remove('hidden')" class="btn" style="background: none; font-size: 24px;">⚙️</button>
        </div>
        <div style="padding: 20px; flex-grow: 1; overflow-y: auto;">
            <h3 style="color: #94a3b8; font-size: 14px; text-transform: uppercase; margin-bottom: 15px;">Your Friends</h3>
            <div id="friendsList" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>
    </div>

    <div id="chatScreen" class="screen hidden" style="z-index: 50;">
        <div style="padding: 15px 20px; background-color: #1e293b; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155;">
            <div style="display: flex; align-items: center;">
                <button onclick="closeChat()" style="background: none; border: none; color: #38bdf8; font-size: 26px; margin-right: 15px; cursor: pointer;">⬅</button>
                <img id="chatHeaderAvatar" src="" style="width: 45px; height: 45px; border-radius: 50%; margin-right: 15px; object-fit: cover; border: 2px solid #38bdf8;">
                <h3 id="chatHeaderName" style="margin: 0; font-size: 18px;"></h3>
            </div>
        </div>

        <div id="chatMessages" style="flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column;"></div>

        <div style="padding: 0 20px; background-color: #0b1120;">
            <img id="chatImagePreview" class="hidden media-preview">
            <video id="chatVideoPreview" class="hidden media-preview" controls></video>
            <audio id="chatAudioPreview" class="hidden" controls style="width: 100%; margin-top: 10px;"></audio>
            <p id="chatUploadStatus" style="color: #38bdf8; font-size: 14px; margin: 5px 0 10px 0;"></p>
        </div>

        <div style="padding: 15px 20px; background-color: #1e293b; border-top: 1px solid #334155; display: flex; gap: 10px; align-items: center;">
            <input type="file" id="chatImageUpload" accept="image/*" class="hidden" onchange="previewChatMedia(event, 'image')">
            <input type="file" id="chatVideoUpload" accept="video/*" class="hidden" onchange="previewChatMedia(event, 'video')">
            <input type="file" id="chatAudioUpload" accept="audio/*" class="hidden" onchange="previewChatMedia(event, 'audio')">
            
            <button onclick="document.getElementById('chatImageUpload').click()" class="btn" style="background: none; font-size: 22px; padding: 0;">📷</button>
            <button onclick="document.getElementById('chatVideoUpload').click()" class="btn" style="background: none; font-size: 22px; padding: 0;">🎥</button>
            <button onclick="document.getElementById('chatAudioUpload').click()" class="btn" style="background: none; font-size: 22px; padding: 0;">🎵</button>
            
            <input type="text" id="chatInput" placeholder="Message..." onkeypress="if(event.key === 'Enter') sendMessage()" style="flex-grow: 1;">
            <button onclick="sendMessage()" class="btn btn-blue" style="border-radius: 50%; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; font-size: 18px;">➤</button>
        </div>
    </div>

    <div id="settingsScreen" class="screen hidden" style="z-index: 60; padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="margin: 0;">Settings</h2>
            <button onclick="document.getElementById('settingsScreen').classList.add('hidden')" class="btn btn-red">Close</button>
        </div>
        <div style="background-color: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 30px;">
            <h3 style="margin-top: 0;">Push Notifications</h3>
            <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">Receive alerts when your friends message you.</p>
            <button onclick="requestNotificationPermission()" class="btn btn-blue" style="width: 100%;">🔔 Enable Notifications</button>
        </div>
        <button id="logoutBtn" class="btn btn-red" style="width: 100%;">Log Out</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, query, orderBy, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-messaging.js";

        // ⚠️ ORIGINAL FIREBASE CONFIG ⚠️
        const firebaseConfig = {
            apiKey: "AIzaSyCiF_rlhJO8TO3RJ2G4OaG9SOZoGgPpvhk",
            authDomain: "dignex-88f5b.firebaseapp.com",
            projectId: "dignex-88f5b",
            storageBucket: "dignex-88f5b.firebasestorage.app",
            messagingSenderId: "1039498013474",
            appId: "1:1039498013474:web:2299eefcfc750de54f537b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const messaging = getMessaging(app);

        let currentUser = null;
        let digNexProfile = null;
        let currentChatFriendId = null;
        let chatUnsubscribe = null;

        // ⚠️ ORIGINAL CLOUDINARY CONFIG ⚠️
        const CLOUDINARY_UPLOAD_PRESET = "dcyl66lfc";
        const CLOUDINARY_CLOUD_NAME = "lzxuzi3d";

        async function uploadToCloudinary(file) {
            const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;
            const fd = new FormData();
            fd.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            fd.append('file', file);
            try {
                const response = await fetch(url, { method: 'POST', body: fd });
                const data = await response.json();
                return data.secure_url;
            } catch (error) { console.error("Cloudinary failed:", error); return null; }
        }

        // --- Auth & Profile Setup ---
        document.getElementById('googleLoginBtn').addEventListener('click', () => {
            signInWithPopup(auth, new GoogleAuthProvider()).catch(err => alert("Login failed: " + err.message));
        });

        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('loginScreen').classList.add('hidden');
                
                const userDocRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userDocRef);

                if (!userSnap.exists() || !userSnap.data().customName) {
                    document.getElementById('profileSetupScreen').classList.remove('hidden');
                    document.getElementById('setupNameInput').value = user.displayName || "";
                    if(user.photoURL) document.getElementById('setupAvatarPreview').src = user.photoURL;
                } else {
                    digNexProfile = userSnap.data();
                    document.getElementById('profileSetupScreen').classList.add('hidden');
                    bootApp();
                }
            } else {
                currentUser = null; digNexProfile = null;
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('mainAppScreen').classList.add('hidden');
                document.getElementById('chatScreen').classList.add('hidden');
                document.getElementById('profileSetupScreen').classList.add('hidden');
                document.getElementById('settingsScreen').classList.add('hidden');
            }
        });

        let setupAvatarFile = null;
        window.previewSetupAvatar = (event) => {
            if(event.target.files[0]) {
                setupAvatarFile = event.target.files[0];
                document.getElementById('setupAvatarPreview').src = URL.createObjectURL(setupAvatarFile);
            }
        };

        window.saveProfile = async () => {
            const nameInput = document.getElementById('setupNameInput').value.trim();
            if (!nameInput) return alert("Please enter a display name!");
            
            const statusText = document.getElementById('setupStatus');
            let finalAvatarUrl = document.getElementById('setupAvatarPreview').src;

            if (setupAvatarFile) {
                statusText.innerText = "Uploading avatar...";
                const uploadedUrl = await uploadToCloudinary(setupAvatarFile);
                if (uploadedUrl) finalAvatarUrl = uploadedUrl;
            }

            statusText.innerText = "Saving profile...";
            digNexProfile = { customName: nameInput, avatarBase64: finalAvatarUrl, uid: currentUser.uid };
            await setDoc(doc(db, "users", currentUser.uid), digNexProfile, { merge: true });
            
            document.getElementById('profileSetupScreen').classList.add('hidden');
            bootApp();
        };

        function bootApp() {
            document.getElementById('mainAppScreen').classList.remove('hidden');
            document.getElementById('myName').innerText = digNexProfile.customName;
            document.getElementById('myAvatar').src = digNexProfile.avatarBase64;
            loadFriendsList();
        }

        // --- Friend List ---
        function loadFriendsList() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                const list = document.getElementById('friendsList');
                list.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    const friend = docSnap.data();
                    if (friend.uid !== currentUser.uid && friend.customName) {
                        const div = document.createElement('div');
                        div.style.cssText = "display:flex; align-items:center; padding:15px; background-color:#1e293b; border-radius:12px; cursor:pointer;";
                        div.innerHTML = `
                            <img src="${friend.avatarBase64}" style="width:50px; height:50px; border-radius:50%; object-fit:cover; margin-right:15px; border:2px solid transparent;">
                            <span style="font-weight:bold; font-size:18px;">${friend.customName}</span>
                        `;
                        div.onclick = () => openChat(friend.uid, friend.customName, friend.avatarBase64);
                        list.appendChild(div);
                    }
                });
            });
        }

        // --- Chat Interface ---
        let chatSelectedFile = null; 
        let chatSelectedFileType = null;

        window.openChat = (friendId, friendName, friendAvatar) => {
            currentChatFriendId = friendId;
            document.getElementById('chatHeaderName').innerText = friendName; 
            document.getElementById('chatHeaderAvatar').src = friendAvatar;
            document.getElementById('chatScreen').classList.remove('hidden');
            
            const chatId = currentUser.uid < friendId ? `${currentUser.uid}_${friendId}` : `${friendId}_${currentUser.uid}`;
            if (chatUnsubscribe) chatUnsubscribe();
            
            chatUnsubscribe = onSnapshot(query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc")), (snapshot) => {
                const chatArea = document.getElementById('chatMessages'); 
                chatArea.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data(); 
                    const isMe = msg.senderId === currentUser.uid;

                    const div = document.createElement('div'); 
                    div.className = `message ${isMe ? 'sent' : 'received'}`;
                    let content = "";
                    
                    if (msg.mediaUrl) {
                        if (msg.mediaType === 'image') content += `<img src="${msg.mediaUrl}" class="media-preview"><br>`;
                        else if (msg.mediaType === 'video') content += `<video src="${msg.mediaUrl}" controls class="media-preview"></video><br>`;
                        else if (msg.mediaType === 'audio') content += `<audio src="${msg.mediaUrl}" controls style="max-width:100%; margin-top:5px;"></audio><br>`;
                    }
                    if (msg.text) content += `<span style="font-size: 16px;">${msg.text}</span>`;

                    div.innerHTML = content; 
                    chatArea.appendChild(div);
                });
                chatArea.scrollTop = chatArea.scrollHeight;
            });
        };

        window.closeChat = () => { 
            document.getElementById('chatScreen').classList.add('hidden'); 
            currentChatFriendId = null; 
            if (chatUnsubscribe) chatUnsubscribe(); 
        };

        window.previewChatMedia = (event, type) => {
            const file = event.target.files[0]; if (!file) return;
            chatSelectedFile = file; chatSelectedFileType = type;
            const imgPre = document.getElementById('chatImagePreview'); 
            const vidPre = document.getElementById('chatVideoPreview'); 
            const audPre = document.getElementById('chatAudioPreview');
            
            imgPre.classList.add('hidden'); vidPre.classList.add('hidden'); audPre.classList.add('hidden');
            
            if (type === 'image') { imgPre.src = URL.createObjectURL(file); imgPre.classList.remove('hidden'); }
            else if (type === 'video') { vidPre.src = URL.createObjectURL(file); vidPre.classList.remove('hidden'); }
            else if (type === 'audio') { audPre.src = URL.createObjectURL(file); audPre.classList.remove('hidden'); }
        };

        window.sendMessage = async () => {
            const input = document.getElementById('chatInput'); 
            const text = input.value.trim();
            if ((text === "" && !chatSelectedFile) || !currentChatFriendId || !currentUser) return;
            
            const statusLabel = document.getElementById('chatUploadStatus'); 
            input.value = ""; 
            
            let chatMediaUrl = null;
            if (chatSelectedFile) {
                statusLabel.innerText = "Uploading attachment...";
                chatMediaUrl = await uploadToCloudinary(chatSelectedFile); 
                chatSelectedFile = null; 
                document.getElementById('chatImagePreview').classList.add('hidden'); 
                document.getElementById('chatVideoPreview').classList.add('hidden'); 
                document.getElementById('chatAudioPreview').classList.add('hidden');
                document.getElementById('chatImageUpload').value = ''; 
                document.getElementById('chatVideoUpload').value = ''; 
                document.getElementById('chatAudioUpload').value = '';
            }
            
            if (chatMediaUrl || text !== "") {
                const chatId = currentUser.uid < currentChatFriendId ? `${currentUser.uid}_${currentChatFriendId}` : `${currentChatFriendId}_${currentUser.uid}`;
                await addDoc(collection(db, "chats", chatId, "messages"), { 
                    senderId: currentUser.uid, text: text, mediaUrl: chatMediaUrl, mediaType: chatSelectedFileType, timestamp: serverTimestamp() 
                });
                
                // --- ORIGINAL NETLIFY PUSH NOTIFICATION TRIGGER ---
                try {
                    const friendDoc = await getDoc(doc(db, "users", currentChatFriendId));
                    if (friendDoc.data() && friendDoc.data().fcmToken) {
                        fetch('/.netlify/functions/sendPush', { 
                            method: 'POST', 
                            body: JSON.stringify({ 
                                token: friendDoc.data().fcmToken, 
                                title: `New message from ${digNexProfile.customName}`, 
                                body: text !== "" ? text : "Sent an attachment" 
                            }) 
                        });
                    }
                } catch (err) { console.error("Push Error:", err); }
            }
            statusLabel.innerText = "";
            chatSelectedFileType = null;
        };

        // --- Push Notification Registration ---
        window.requestNotificationPermission = async () => {
            try {
                const registration = await navigator.serviceWorker.register('./firebase-messaging-sw.js'); 
                await navigator.serviceWorker.ready;
                
                // ⚠️ PASTE YOUR VAPID KEY BELOW ⚠️
                const currentToken = await getToken(messaging, { 
                    vapidKey: "BOEJshwyI0lNpsEspDyuVG7M95DmColVvtcZWCWX85wCfbUd6F30L7N39oyBXP0o_gq55R1Qen1JPcglhznq2lU", 
                    serviceWorkerRegistration: registration 
                });
                
                if (currentToken && currentUser) { 
                    await updateDoc(doc(db, "users", currentUser.uid), { fcmToken: currentToken }); 
                    alert("SUCCESS! Notifications Enabled! 🎉"); 
                }
            } catch (error) { 
                alert("ERROR: " + error.message); 
            }
        };
    </script>
</body>
</html>
